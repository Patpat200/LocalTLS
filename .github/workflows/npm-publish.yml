name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must be v${version}; update package.json before releasing.`);
          }
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check package contents
        run: npm pack --dry-run

      # prepublishOnly runs the test suite before npm uploads the package.
      # Configure npm's trusted publisher for this exact workflow filename.
      - name: Test and publish to npm using OIDC
        run: npm publish --access public
